name: CI

on:
  push:
  pull_request:

jobs:
  domain-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run MedReportKit tests
        run: swift test --package-path Packages/MedReportKit

  app-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check strings
        run: python3 scripts/check-strings.py
      - name: Run app tests
        run: ./scripts/ci-app-tests.sh
